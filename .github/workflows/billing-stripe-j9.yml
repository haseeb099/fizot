# J9 billing lifecycle against Stripe test mode. Not on the daily gate.
# Transport must stay live. Fake-unit PASS is not live acceptance.
# Hosted Checkout completion is manual (prepare → browser → resume).
# Stripe CLI signed webhook capture is required for live webhook evidence.
# Do not expose a public production webhook endpoint from this workflow.
name: Fizot billing Stripe test mode (J9)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "full | prepare | resume | cleanup"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - resume
          - cleanup
          - full
      artifact_path:
        description: "Path for the non-secret run artifact JSON"
        required: true
        default: artifacts/j9/run.json
        type: string
      webhook_capture_path:
        description: "Optional Stripe CLI signed capture JSON (resume)"
        required: false
        default: ""
        type: string
      cleanup_confirm:
        description: "Must equal artifact runId when stage=cleanup"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  j9:
    name: Stripe test-mode billing lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run J9 stage
        env:
          STRIPE_J9_MODE: test
          STRIPE_J9_TRANSPORT: live
          STRIPE_J9_STAGE: ${{ inputs.stage }}
          STRIPE_J9_ARTIFACT_PATH: ${{ inputs.artifact_path }}
          STRIPE_J9_WEBHOOK_CAPTURE_PATH: ${{ inputs.webhook_capture_path }}
          STRIPE_J9_CLEANUP_CONFIRM: ${{ inputs.cleanup_confirm }}
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_J9_PRICE_HOME: ${{ vars.STRIPE_J9_PRICE_HOME }}
          STRIPE_J9_PRICE_TEAM: ${{ vars.STRIPE_J9_PRICE_TEAM }}
          FIZOT_BILLING_SUCCESS_URL: https://admin.example.invalid/billing/success
          FIZOT_BILLING_CANCEL_URL: https://admin.example.invalid/billing/cancel
          FIZOT_BILLING_PORTAL_RETURN_URL: https://admin.example.invalid/billing
        run: node --experimental-strip-types scripts/fizot/billing-j9.mjs --stage=${{ inputs.stage }} --artifact=${{ inputs.artifact_path }}
      - name: Upload non-secret J9 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j9-run-artifact
          path: ${{ inputs.artifact_path }}
          if-no-files-found: ignore
