# J9 billing lifecycle against Stripe test mode. Not on the daily gate.
# Transport must stay live. Fake-unit PASS is not live acceptance.
# Credentials alone never pass. Hosted Checkout completion and Test Clock dunning
# remain required for live_acceptance=true.
name: Fizot billing Stripe test mode (J9)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j9:
    name: Stripe test-mode billing lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout, dunning, recovery, cleanup
        env:
          STRIPE_J9_MODE: test
          STRIPE_J9_TRANSPORT: live
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_J9_PRICE_HOME: ${{ vars.STRIPE_J9_PRICE_HOME }}
          STRIPE_J9_PRICE_TEAM: ${{ vars.STRIPE_J9_PRICE_TEAM }}
          FIZOT_BILLING_SUCCESS_URL: https://admin.example.invalid/billing/success
          FIZOT_BILLING_CANCEL_URL: https://admin.example.invalid/billing/cancel
          FIZOT_BILLING_PORTAL_RETURN_URL: https://admin.example.invalid/billing
        run: node --experimental-strip-types scripts/fizot/billing-j9.mjs
