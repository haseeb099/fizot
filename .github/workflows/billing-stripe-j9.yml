# J9 billing lifecycle against Stripe test mode. Not on the daily gate.
# Transport must stay live. Fake-unit PASS is not live acceptance.
#
# Operator journey (same run, latest artifact):
# 1) Dispatch stage=prepare. Note github.run_id from the run URL and printed j9run_….
# 2) Open Checkout URL; pay with a Stripe test card.
# 3) Locally: stripe listen → save unmodified body + Stripe-Signature header files →
#    node --experimental-strip-types scripts/fizot/j9-pack-webhook-capture.mjs …
#    → artifacts/j9/webhook-capture.json. Put ONLY that file on a throwaway branch,
#    dispatch stage=upload_capture on that ref, note github.run_id as capture_run_id,
#    then delete the throwaway branch. Artifacts retain 7 days; never include secrets/cards.
# 4) First resume: artifact_run_id=<prepare github.run_id>, capture_run_id=<upload_capture run>.
# 5) If resume is BLOCKED/FAIL and resources were retained, download the artifact uploaded
#    by THAT resume run and set artifact_run_id=<that resume run id> for the next resume.
#    Never re-download a stale prepare artifact after lifecycle has advanced.
# 6) Confirmed cleanup (including expired runs): stage=cleanup,
#    artifact_run_id=<run that uploaded the latest artifact>,
#    cleanup_confirm=<j9run_…>.
#
# Paths are fixed under artifacts/j9/. Workflow inputs are never used as shell paths.
# Never put Stripe secrets, webhook secrets, or card details in artifacts.
name: Fizot billing Stripe test mode (J9)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prepare | resume | cleanup | upload_capture | full"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - resume
          - cleanup
          - upload_capture
          - full
      artifact_run_id:
        description: "GitHub Actions run id that uploaded the LATEST j9-run-artifact (digits)."
        required: false
        default: ""
        type: string
      prepare_run_id:
        description: "Deprecated alias for artifact_run_id (digits). Prefer artifact_run_id."
        required: false
        default: ""
        type: string
      capture_run_id:
        description: "GitHub Actions run id that uploaded j9-webhook-capture (digits)."
        required: false
        default: ""
        type: string
      cleanup_confirm:
        description: "Must equal artifact runId when stage=cleanup"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  j9:
    name: Stripe test-mode billing lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve artifact handoff run id
        id: handoff
        env:
          STAGE: ${{ inputs.stage }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
          CLEANUP_CONFIRM: ${{ inputs.cleanup_confirm }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            prepare|resume|cleanup|upload_capture|full) ;;
            *) echo "invalid stage"; exit 1 ;;
          esac
          HANDOFF="${ARTIFACT_RUN_ID:-$PREPARE_RUN_ID}"
          if [[ "$STAGE" == "resume" || "$STAGE" == "cleanup" ]]; then
            [[ "$HANDOFF" =~ ^[0-9]+$ ]] || { echo "artifact_run_id (or prepare_run_id) must be digits"; exit 1; }
          fi
          if [[ -n "$CAPTURE_RUN_ID" ]]; then
            [[ "$CAPTURE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "capture_run_id must be digits"; exit 1; }
          fi
          if [[ "$STAGE" == "cleanup" ]]; then
            [[ "$CLEANUP_CONFIRM" =~ ^j9run_[0-9a-f]+$ ]] || { echo "cleanup_confirm must be j9run_…"; exit 1; }
          fi
          echo "run_id=$HANDOFF" >> "$GITHUB_OUTPUT"

      - name: Validate and upload webhook capture only
        if: ${{ inputs.stage == 'upload_capture' }}
        run: |
          set -euo pipefail
          test -f artifacts/j9/webhook-capture.json
          node --experimental-strip-types -e "
            import { readFileSync } from 'node:fs';
            const raw = JSON.parse(readFileSync('artifacts/j9/webhook-capture.json','utf8'));
            if (raw.schemaVersion !== 2 || raw.kind !== 'stripe_cli_signed_capture') throw new Error('schema');
            if (typeof raw.runId !== 'string' || !raw.runId.startsWith('j9run_')) throw new Error('runId');
            if (!Array.isArray(raw.deliveries) || raw.deliveries.length < 1) throw new Error('deliveries');
            for (const d of raw.deliveries) {
              if (typeof d.body !== 'string' || !d.body) throw new Error('body');
              if (typeof d.stripeSignatureHeader !== 'string' || !d.stripeSignatureHeader.includes('v1=')) throw new Error('sig');
              if (d.body.includes('sk_test_') || d.body.includes('sk_live_') || d.body.includes('whsec_')) throw new Error('secret');
            }
            console.log('j9_upload_capture ok runId=' + raw.runId + ' deliveries=' + raw.deliveries.length);
          "

      - name: Upload j9-webhook-capture artifact
        if: ${{ inputs.stage == 'upload_capture' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j9-webhook-capture
          path: artifacts/j9/webhook-capture.json
          retention-days: 7
          if-no-files-found: error

      - name: Download latest J9 run artifact
        if: ${{ inputs.stage == 'resume' || inputs.stage == 'cleanup' }}
        uses: actions/download-artifact@634f93cb3702e9abc76e11045e0aa28c4201ca48 # v5.0.0
        with:
          name: j9-run-artifact
          path: artifacts/j9
          run-id: ${{ steps.handoff.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download webhook capture artifact
        if: ${{ inputs.stage == 'resume' && inputs.capture_run_id != '' }}
        uses: actions/download-artifact@634f93cb3702e9abc76e11045e0aa28c4201ca48 # v5.0.0
        with:
          name: j9-webhook-capture
          path: artifacts/j9
          run-id: ${{ inputs.capture_run_id }}
          github-token: ${{ github.token }}

      - name: Run J9 stage
        if: ${{ inputs.stage != 'upload_capture' }}
        env:
          STRIPE_J9_MODE: test
          STRIPE_J9_TRANSPORT: live
          STRIPE_J9_STAGE: ${{ inputs.stage }}
          STRIPE_J9_ARTIFACT_RUN_ID: ${{ steps.handoff.outputs.run_id }}
          STRIPE_J9_CLEANUP_CONFIRM: ${{ inputs.cleanup_confirm }}
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_J9_ARTIFACT_HMAC_SECRET: ${{ secrets.STRIPE_J9_ARTIFACT_HMAC_SECRET }}
          STRIPE_J9_PRICE_HOME: ${{ vars.STRIPE_J9_PRICE_HOME }}
          STRIPE_J9_PRICE_TEAM: ${{ vars.STRIPE_J9_PRICE_TEAM }}
          FIZOT_BILLING_SUCCESS_URL: https://admin.example.invalid/billing/success
          FIZOT_BILLING_CANCEL_URL: https://admin.example.invalid/billing/cancel
          FIZOT_BILLING_PORTAL_RETURN_URL: https://admin.example.invalid/billing
        run: node --experimental-strip-types scripts/fizot/billing-j9.mjs

      - name: Upload latest non-secret J9 run artifact
        if: ${{ always() && inputs.stage != 'upload_capture' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j9-run-artifact
          path: artifacts/j9/run.json
          retention-days: 7
          if-no-files-found: ignore
