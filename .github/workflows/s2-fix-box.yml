name: Box check on upstream

on:
  workflow_dispatch:
  push:
    branches: [sandbox/s2-fix]

permissions:
  contents: read

jobs:
  upstream:
    name: upstream box without extra packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0213b7435fc83a936f77c18475ba2a0d7b7c2de4
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: bubblewrap and socat on the runner
        run: |
          set +e
          command -v bwrap; bwrap --version
          command -v socat; socat -V
          echo "bwrap_present=$(command -v bwrap >/dev/null && echo yes || echo no)"
          echo "socat_present=$(command -v socat >/dev/null && echo yes || echo no)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/bot-box/self-check.linux.test.ts
  upstream-with-tools:
    name: upstream box with bubblewrap and socat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0213b7435fc83a936f77c18475ba2a0d7b7c2de4
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install bubblewrap and socat
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/bot-box/self-check.linux.test.ts
