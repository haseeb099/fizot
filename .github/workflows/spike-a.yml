name: Spike A network capture

# Needs Linux for the logging proxy and optional strace attach. Not part of the
# daily CI gate. workflow_dispatch is the steady trigger once this file is on
# main; pull_request (path-filtered) is how the first evidence run starts from
# a branch GitHub has not yet listed for manual dispatch.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/spike-a.yml"
      - "scripts/fizot/spike-a.mjs"
      - "scripts/fizot/spike-a-*.mjs"
      - "tests/fizot/spike-a.test.ts"

permissions:
  contents: read

jobs:
  spike-a:
    name: Spike A capture (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=7000
      SPIKE_A_BROWSER: "1"
      OMB_UI_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Spike A capture
        run: node --experimental-strip-types scripts/fizot/spike-a.mjs --strace
      - name: Upload Spike A artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-a
          path: artifacts/spike-a/
          if-no-files-found: warn
