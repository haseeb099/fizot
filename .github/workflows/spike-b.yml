name: Spike B proxy and canary

# Not part of the daily CI gate. workflow_dispatch once on main; path-filtered
# pull_request starts the first evidence run from this branch.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/spike-b.yml"
      - "server/fizot/proxy/**"
      - "scripts/fizot/spike-b.mjs"
      - "tests/fizot/spike-b*.test.ts"
      - "tests/fizot/cloud-ai-url.test.ts"

permissions:
  contents: read

jobs:
  spike-b:
    name: Spike B proxy + box-check (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=7000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server dist for box-check
        run: pnpm build:server
      - name: Unit and canary tests
        run: pnpm exec vitest run server/fizot/proxy tests/fizot/spike-b-canary.test.ts tests/fizot/cloud-ai-url.test.ts
      - name: Run Spike B harness
        run: node --experimental-strip-types scripts/fizot/spike-b.mjs
      - name: box-check on this tree
        run: node dist-server/bot-box/box-check.js | tee artifacts/spike-b/box-check-live.txt
        continue-on-error: true
      - name: box-check on upstream-mirror for comparison
        run: |
          mkdir -p artifacts/spike-b
          git fetch --depth 1 origin upstream-mirror
          git worktree add /tmp/fizot-upstream origin/upstream-mirror
          cd /tmp/fizot-upstream
          pnpm install --frozen-lockfile
          pnpm build:server
          node dist-server/bot-box/box-check.js | tee "$GITHUB_WORKSPACE/artifacts/spike-b/box-check-upstream.txt" || true
        continue-on-error: true
      - name: Upload Spike B artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-b
          path: artifacts/spike-b/
          if-no-files-found: warn
